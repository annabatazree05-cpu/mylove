body{
  font-family: Georgia, serif;
  text-align:center;
  background:#ffe6f0; /* soft pastel pink */
  padding:40px;
  overflow-x:hidden;
  position: relative;
}

/* floating hearts animation */
.heart {
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ff4d94;
  transform: rotate(45deg);
  animation: float 6s linear infinite;
  z-index: 0;
  border-radius: 3px;
}
.heart::before,
.heart::after {
  content: "";
  position: absolute;
  width: 20px;
  height: 20px;
  background: #ff4d94;
  border-radius: 50%;
}
.heart::before { top: -10px; left: 0; }
.heart::after { top: 0; left: -10px; }

@keyframes float {
  0% { transform: translateY(0) rotate(45deg); opacity:1; }
  100% { transform: translateY(-800px) rotate(45deg); opacity:0; }
}

}
